[package]
name = "chroma-crypto"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Chroma cryptography: Schnorr, BLAKE3, Bech32m, RandomX bindings"

[dependencies]
chroma-core = { path = "../chroma-core" }
blake3 = "1.5"
sha2 = "0.10"
ripemd = "0.1"
hex = "0.4"
secp256k1 = { version = "0.27", features = ["rand", "rand-std"] }
bech32 = "0.11"
thiserror = "1.0"
getrandom = "0.2"

[dev-dependencies]
proptest = "1.5"