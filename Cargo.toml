[workspace]
resolver = "3"
members = [
    "crates/chroma-core",
    "crates/chroma-crypto",
    "crates/chroma-state",
    "crates/chroma-tx",
    "crates/chroma-block",
    "crates/chroma-consensus",
    "crates/chroma-storage",
    "crates/chroma-p2p",
    "crates/chroma-wallet",
    "crates/chroma-cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chroma/chroma"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1